[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fonts, logos and uploaded files rarely change. The stylesheet gets a new
# address (?v=...) whenever it changes, so caching it for a week is safe too.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The notes editor is for the team: keep it out of search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# No trailing-slash redirects here: Netlify's Pretty URLs already forwards
# /health-security to /health-security/, and redirect rules cannot add or
# remove trailing slashes (they can loop). See docs.netlify.com, Redirect options.

# A replaced file gets a new name, so no browser keeps showing a cached copy of
# the old one (uploads are cached for a week). The old address forwards to the
# new file, so links already shared keep working.
[[redirects]]
  from = "/assets/uploads/present-lab-rapid-preparedness-diagnostic-v1.0.pdf"
  to = "/assets/uploads/present-lab-rapid-preparedness-diagnostic-methodology-note-v1.0.pdf"
  status = 301

# Short address for SIMEX, used in the launch film and posts. 302 (temporary), so it can later point
# to a page of its own without browsers holding on to the old destination.
[[redirects]]
  from = "/simex"
  to = "/notes/simex/"
  status = 302
