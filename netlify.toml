[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# No trailing-slash redirects here: Netlify's Pretty URLs already forwards
# /health-security to /health-security/, and redirect rules cannot add or
# remove trailing slashes (they can loop). See docs.netlify.com, Redirect options.
